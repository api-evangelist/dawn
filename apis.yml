name: Dawn
description: Dawn (Sleepedy, Inc. dba Dawn) is a digital-health company offering a clinician-guided
  Cognitive Behavioral Therapy for Insomnia (CBT-I) program delivered through a mobile app. The service
  pairs users with licensed sleep coaches and therapists for weekly video sessions and between-session
  chat, daily 5-7 minute sleep lessons, live sleep-performance insights, and weekly progress reports,
  with the goal of treating primary and chronic insomnia and reducing reliance on sleep medication. Dawn
  is in-network with major U.S. insurers (Aetna, Anthem, Cigna, United Healthcare, Blue Cross Blue Shield)
  and offers an employer/enterprise workplace-wellness program. Backed by Kindred Ventures. Dawn publishes
  a consumer app and marketing site but no public developer API, SDKs, or OpenAPI at this time.
